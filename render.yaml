services:
  - type: web
    name: dorjex-ai-tutor-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    rootDir: backend
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: dorjex-db
          property: connectionString
      - key: PYTHON_VERSION
        value: "3.11"
      - key: APP_ENV
        value: production

databases:
  - name: dorjex-db
    databaseName: dorjex
    user: dorjex_user
    plan: free
