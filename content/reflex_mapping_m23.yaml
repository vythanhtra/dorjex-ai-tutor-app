# reflex_mapping_m23.yaml
# Ánh xạ phản xạ đa tầng cho M23: AI Agents trong DorjeX | AI Tutor v2.4

module: M23
description: >
  Ánh xạ phản xạ cho M23, hỗ trợ các cấp độ general, depth, và expert, liên kết với
  lesson_m23_ai_agents.md, quiz_m23.yaml, và certificate_template.tex.
reflex_modes:
  - mode: general
    description: Phản hồi cơ bản, phù hợp với người học mới
    triggers:
      - "AI agents"
      - "Orchestrated agents"
      - "Tác nhân AI"
    responses:
      - content: >
          AI Agents là hệ thống tự động sử dụng prompt, tool, và policy để thực hiện nhiệm vụ.
          Ví dụ: Agent hỗ trợ khách hàng. Bạn muốn học chi tiết không?
        linked_files:
          - lesson_m23_ai_agents.md
      - content: >
          Hoàn thành M23 để nhận chứng chỉ! Làm quiz_m23.yaml và gửi phản hồi qua
          feedback_form_macro.yaml.
        linked_files:
          - quiz_m23.yaml
          - feedback_form_macro.yaml
          - certificate_template.tex
  - mode: depth
    description: Phản hồi chi tiết, bao gồm kỹ thuật và ứng dụng
    triggers:
      - "ReAct agent"
      - "Guardrails AI"
      - "Multi-agent"
    responses:
      - content: >
          ReAct kết hợp suy luận và hành động, khác với Planning agent lập kế hoạch trước.
          Xem chi tiết trong lesson_m23_ai_agents.md.
        linked_files:
          - lesson_m23_ai_agents.md
      - content: >
          Case study m23_ethics (sandbox_alignment_m23.yaml): Agent y tế đưa lời khuyên sai.
          Phân tích đạo đức?
        linked_files:
          - sandbox_alignment_m23.yaml
      - content: >
          Để nhận chứng chỉ M23, đạt điểm quiz ≥80% và cung cấp tên qua feedback_form_macro.yaml.
          Chứng chỉ được mã hóa AES-256 theo certificate_data_protection.yaml.
        linked_files:
          - feedback_form_macro.yaml
          - certificate_template.tex
          - certificate_data_protection.yaml
  - mode: expert
    description: Phản hồi nâng cao, tập trung vào đạo đức và tuân thủ
    triggers:
      - "Agent ethics"
      - "AI agent compliance"
      - "Đạo đức tác nhân AI"
    responses:
      - content: >
          AI Agents cần guardrails để đảm bảo đạo đức và minh bạch. Xem chi tiết trong
          lesson_m23_ai_agents.md.
        linked_files:
          - lesson_m23_ai_agents.md
      - content: >
          Theo EU AI Act, agent tự học phải có kiểm soát rủi ro. Xem case study
          (sandbox_alignment_m23.yaml). Phân tích thêm?
        linked_files:
          - sandbox_alignment_m23.yaml
      - content: >
          Dữ liệu chứng chỉ được mã hóa AES-256 và xóa sau 30 ngày theo certificate_data_protection.yaml.
        linked_files:
          - certificate_data_protection.yaml
          - certificate_template.tex
linked_macros:
  - reflex_macro_UPDATED.yaml
  - tone_profile.json
guidelines:
  - Phản hồi theo ngôn ngữ người dùng (vi/en)
  - Không tiết lộ file nội bộ trừ khi trigger khớp
  - Tuân thủ UNESCO AI Ethics, GDPR, và Nghị định 13/2023