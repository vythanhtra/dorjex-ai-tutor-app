# reflex_mapping_m21.yaml
# Ánh xạ phản xạ đa tầng cho M21: AI for Education trong DorjeX | AI Tutor v2.4

module: M21
description: >
  Ánh xạ phản xạ cho M21, hỗ trợ các cấp độ general, depth, và expert, liên kết với
  lesson_m21_ai_for_education.md, quiz_m21.yaml, và certificate_template.tex.
reflex_modes:
  - mode: general
    description: Phản hồi cơ bản, phù hợp với người học mới
    triggers:
      - "AI education"
      - "Học cá nhân hóa"
      - "AI giáo dục"
    responses:
      - content: >
          AI for Education hỗ trợ học tập cá nhân hóa. Ví dụ: Hệ thống tutor AI.
          Bạn muốn học chi tiết không?
        linked_files:
          - lesson_m21_ai_for_education.md
      - content: >
          Hoàn thành M21 để nhận chứng chỉ! Làm quiz_m21.yaml và gửi phản hồi qua
          feedback_form_macro.yaml.
        linked_files:
          - quiz_m21.yaml
          - feedback_form_macro.yaml
          - certificate_template.tex
  - mode: depth
    description: Phản hồi chi tiết, bao gồm ứng dụng và công cụ
    triggers:
      - "Personalized learning"
      - "Adaptive learning"
      - "Học thích nghi"
    responses:
      - content: >
          Adaptive learning điều chỉnh nội dung theo học viên. Xem ví dụ trong
          lesson_m21_ai_for_education.md.
        linked_files:
          - lesson_m21_ai_for_education.md
      - content: >
          Case study m21_ethics (sandbox_ethics_dual.yaml): AI giáo dục thu thập dữ liệu học sinh.
          Phân tích đạo đức?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Để nhận chứng chỉ M21, đạt điểm quiz ≥80% và cung cấp tên qua feedback_form_macro.yaml.
          Chứng chỉ được mã hóa AES-256 theo certificate_data_protection.yaml.
        linked_files:
          - feedback_form_macro.yaml
          - certificate_template.tex
          - certificate_data_protection.yaml
  - mode: expert
    description: Phản hồi nâng cao, tập trung vào đạo đức và quyền riêng tư
    triggers:
      - "Education ethics"
      - "Education privacy"
      - "Đạo đức giáo dục AI"
    responses:
      - content: >
          AI giáo dục cần bảo vệ dữ liệu học viên. Xem chi tiết trong lesson_m21_ai_for_education.md.
        linked_files:
          - lesson_m21_ai_for_education.md
      - content: >
          Theo GDPR, AI giáo dục phải xin phép dữ liệu. Xem case study
          (sandbox_ethics_dual.yaml). Phân tích thêm?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Dữ liệu chứng chỉ được mã hóa AES-256 và xóa sau 30 ngày theo certificate_data_protection.yaml.
        linked_files:
          - certificate_data_protection.yaml
          - certificate_template.tex
linked_macros:
  - reflex_macro_UPDATED.yaml
  - tone_profile.yaml
guidelines:
  - Phản hồi theo ngôn ngữ người dùng (vi/en)
  - Không tiết lộ file nội bộ trừ khi trigger khớp
  - Tuân thủ UNESCO AI Ethics, GDPR, và Nghị định 13/2023