# reflex_mapping_m4.yaml
# Ánh xạ phản xạ đa tầng cho M4: Prompt Engineering trong DorjeX | AI Tutor v2.4

module: M4
description: >
  Ánh xạ phản xạ cho M4, hỗ trợ các cấp độ general, depth, và expert, liên kết với
  lesson_m4_prompt_engineering.md, quiz_m4.yaml, và certificate_template.tex.
reflex_modes:
  - mode: general
    description: Phản hồi cơ bản, phù hợp với người học mới
    triggers:
      - "Prompt engineering"
      - "Prompt"
      - "Viết prompt"
    responses:
      - content: >
          Prompt Engineering là kỹ thuật thiết kế câu lệnh để tối ưu phản hồi AI. Ví dụ: Câu hỏi rõ ràng cho ChatGPT.
          Bạn muốn học chi tiết không?
        linked_files:
          - lesson_m4_prompt_engineering.md
      - content: >
          Hoàn thành M4 để nhận chứng chỉ! Làm quiz_m4.yaml và gửi phản hồi qua
          feedback_form_macro.yaml.
        linked_files:
          - quiz_m4.yaml
          - feedback_form_macro.yaml
          - certificate_template.tex
  - mode: depth
    description: Phản hồi chi tiết, bao gồm kỹ thuật và ví dụ
    triggers:
      - "Zero-shot"
      - "Prompt design"
      - "Thiết kế prompt"
    responses:
      - content: >
          Zero-shot prompting cho phép AI trả lời mà không cần ví dụ huấn luyện. Xem ví dụ trong
          lesson_m4_prompt_engineering.md.
        linked_files:
          - lesson_m4_prompt_engineering.md
      - content: >
          Case study m4_ethics (sandbox_ethics_dual.yaml): Prompt thu thập dữ liệu người dùng
          mà không xin phép. Phân tích đạo đức?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Để nhận chứng chỉ M4, đạt điểm quiz ≥80% và cung cấp tên qua feedback_form_macro.yaml.
          Chứng chỉ được mã hóa AES-256 theo certificate_data_protection.yaml.
        linked_files:
          - feedback_form_macro.yaml
          - certificate_template.tex
          - certificate_data_protection.yaml
  - mode: expert
    description: Phản hồi nâng cao, tập trung vào đạo đức và tuân thủ
    triggers:
      - "Prompt ethics"
      - "Prompt compliance"
      - "Đạo đức prompt"
    responses:
      - content: >
          Prompt phải minh bạch và không gây hại. Xem chi tiết trong lesson_m4_prompt_engineering.md.
        linked_files:
          - lesson_m4_prompt_engineering.md
      - content: >
          Theo GDPR/EU AI Act, prompt phải thông báo mục đích dữ liệu. Xem case study
          (sandbox_ethics_dual.yaml). Phân tích thêm?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Dữ liệu chứng chỉ được mã hóa AES-256 và xóa sau 30 ngày theo certificate_data_protection.yaml.
        linked_files:
          - certificate_data_protection.yaml
          - certificate_template.tex
linked_macros:
  - reflex_macro_UPDATED.yaml
  - tone_profile.yaml
guidelines:
  - Phản hồi theo ngôn ngữ người dùng (vi/en)
  - Không tiết lộ file nội bộ trừ khi trigger khớp
  - Tuân thủ UNESCO AI Ethics, GDPR, và Nghị định 13/2023