# reflex_mapping_m7.yaml
# Ánh xạ phản xạ đa tầng cho M7: Prompt Engineering trong DorjeX | AI Tutor v2.4

module: M7
description: >
  Ánh xạ phản xạ cho M7, hỗ trợ các cấp độ general, depth, và expert, liên kết với
  lesson_m7_prompt_engineering_final.md, quiz_m7_prompt.yaml, và certificate_template.tex.
reflex_modes:
  - mode: general
    description: Phản hồi cơ bản, phù hợp với người học mới
    triggers:
      - "Prompt engineering final"
      - "Prompt nâng cao"
      - "Kỹ thuật prompt"
    responses:
      - content: >
          Prompt Engineering nâng cao tập trung vào kỹ thuật đa phương thức và CoT. Ví dụ: Prompt cho hình ảnh.
          Bạn muốn học chi tiết không?
        linked_files:
          - lesson_m7_prompt_engineering_final.md
      - content: >
          Hoàn thành M7 để nhận chứng chỉ! Làm quiz_m7_prompt.yaml và gửi phản hồi qua
          feedback_form_macro.yaml.
        linked_files:
          - quiz_m7_prompt.yaml
          - feedback_form_macro.yaml
          - certificate_template.tex
  - mode: depth
    description: Phản hồi chi tiết, bao gồm kỹ thuật và ứng dụng
    triggers:
      - "Multimodal prompt"
      - "CoT prompting"
      - "Prompt đa phương thức"
    responses:
      - content: >
          Multimodal prompt kết hợp văn bản và hình ảnh. Xem ví dụ trong
          lesson_m7_prompt_engineering_final.md.
        linked_files:
          - lesson_m7_prompt_engineering_final.md
      - content: >
          Case study m7_ethics (sandbox_ethics_dual.yaml): Prompt đa phương thức vi phạm bản quyền.
          Phân tích đạo đức?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Để nhận chứng chỉ M7, đạt điểm quiz ≥80% và cung cấp tên qua feedback_form_macro.yaml.
          Chứng chỉ được mã hóa AES-256 theo certificate_data_protection.yaml.
        linked_files:
          - feedback_form_macro.yaml
          - certificate_template.tex
          - certificate_data_protection.yaml
  - mode: expert
    description: Phản hồi nâng cao, tập trung vào đạo đức và tuân thủ
    triggers:
      - "Prompt compliance"
      - "Prompt regulation"
      - "Tuân thủ prompt"
    responses:
      - content: >
          Prompt phải tuân thủ quy định pháp luật. Xem chi tiết trong lesson_m7_prompt_engineering_final.md.
        linked_files:
          - lesson_m7_prompt_engineering_final.md
      - content: >
          Theo EU AI Act, prompt đa phương thức cần kiểm soát nội dung. Xem case study
          (sandbox_ethics_dual.yaml). Phân tích thêm?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Dữ liệu chứng chỉ được mã hóa AES-256 và xóa sau 30 ngày theo certificate_data_protection.yaml.
        linked_files:
          - certificate_data_protection.yaml
          - certificate_template.tex
linked_macros:
  - reflex_macro_UPDATED.yaml
  - tone_profile.yaml
guidelines:
  - Phản hồi theo ngôn ngữ người dùng (vi/en)
  - Không tiết lộ file nội bộ trừ khi trigger khớp
  - Tuân thủ UNESCO AI Ethics, GDPR, và Nghị định 13/2023