# reflex_mapping_m5.yaml
# Ánh xạ phản xạ đa tầng cho M5: Advanced Prompting trong DorjeX | AI Tutor v2.4

module: M5
description: >
  Ánh xạ phản xạ cho M5, hỗ trợ các cấp độ general, depth, và expert, liên kết với
  lesson_m5_advanced_prompting.md, quiz_m5.yaml, và certificate_template.tex.
reflex_modes:
  - mode: general
    description: Phản hồi cơ bản, phù hợp với người học mới
    triggers:
      - "ToT"
      - "ReAct"
      - "Prompt nâng cao"
    responses:
      - content: >
          Advanced Prompting bao gồm kỹ thuật như Tree of Thoughts (ToT) và ReAct để tăng
          hiệu quả AI. Ví dụ: Giải bài toán phức tạp. Bạn muốn học chi tiết không?
        linked_files:
          - lesson_m5_advanced_prompting.md
      - content: >
          Hoàn thành M5 để nhận chứng chỉ! Làm quiz_m5.yaml và gửi phản hồi qua
          feedback_form_macro.yaml.
        linked_files:
          - quiz_m5.yaml
          - feedback_form_macro.yaml
          - certificate_template.tex
  - mode: depth
    description: Phản hồi chi tiết, bao gồm kỹ thuật và ứng dụng
    triggers:
      - "Chain of Thought"
      - "Reflex prompting"
      - "ToT ứng dụng"
    responses:
      - content: >
          Chain of Thought (CoT) hướng dẫn AI suy luận từng bước. Xem ví dụ trong
          lesson_m5_advanced_prompting.md.
        linked_files:
          - lesson_m5_advanced_prompting.md
      - content: >
          Case study m5_ethics (sandbox_ethics_dual.yaml): ToT tạo nội dung gây tranh cãi.
          Phân tích đạo đức?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Để nhận chứng chỉ M5, đạt điểm quiz ≥80% và cung cấp tên qua feedback_form_macro.yaml.
          Chứng chỉ được mã hóa AES-256 theo certificate_data_protection.yaml.
        linked_files:
          - feedback_form_macro.yaml
          - certificate_template.tex
          - certificate_data_protection.yaml
  - mode: expert
    description: Phản hồi nâng cao, tập trung vào đạo đức và xu hướng
    triggers:
      - "Advanced prompt ethics"
      - "Prompt robustness"
      - "Đạo đức prompt nâng cao"
    responses:
      - content: >
          Prompt nâng cao cần đảm bảo tính mạnh mẽ trước tấn công. Xem chi tiết trong
          lesson_m5_advanced_prompting.md.
        linked_files:
          - lesson_m5_advanced_prompting.md
      - content: >
          Theo EU AI Act, prompt phải tránh nội dung gây hại. Xem case study
          (sandbox_ethics_dual.yaml). Phân tích thêm?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Dữ liệu chứng chỉ được mã hóa AES-256 và xóa sau 30 ngày theo certificate_data_protection.yaml.
        linked_files:
          - certificate_data_protection.yaml
          - certificate_template.tex
linked_macros:
  - reflex_macro_UPDATED.yaml
  - tone_profile.yaml
guidelines:
  - Phản hồi theo ngôn ngữ người dùng (vi/en)
  - Không tiết lộ file nội bộ trừ khi trigger khớp
  - Tuân thủ UNESCO AI Ethics, GDPR, và Nghị định 13/2023