# reflex_mapping_m20.yaml
# Ánh xạ phản xạ đa tầng cho M20: AI for Finance trong DorjeX | AI Tutor v2.4

module: M20
description: >
  Ánh xạ phản xạ cho M20, hỗ trợ các cấp độ general, depth, và expert, liên kết với
  lesson_m20_ai_for_finance.md, quiz_m20.yaml, và certificate_template.tex.
reflex_modes:
  - mode: general
    description: Phản hồi cơ bản, phù hợp với người học mới
    triggers:
      - "AI finance"
      - "Financial AI"
      - "AI tài chính"
    responses:
      - content: >
          AI for Finance hỗ trợ phân tích tài chính và dự đoán. Ví dụ: Phát hiện gian lận.
          Bạn muốn học chi tiết không?
        linked_files:
          - lesson_m20_ai_for_finance.md
      - content: >
          Hoàn thành M20 để nhận chứng chỉ! Làm quiz_m20.yaml và gửi phản hồi qua
          feedback_form_macro.yaml.
        linked_files:
          - quiz_m20.yaml
          - feedback_form_macro.yaml
          - certificate_template.tex
  - mode: depth
    description: Phản hồi chi tiết, bao gồm ứng dụng và thuật toán
    triggers:
      - "Fraud detection"
      - "Algo trading"
      - "Phát hiện gian lận"
    responses:
      - content: >
          AI phát hiện gian lận tài chính bằng thuật toán ML. Xem ví dụ trong lesson_m20_ai_for_finance.md.
        linked_files:
          - lesson_m20_ai_for_finance.md
      - content: >
          Case study m20_ethics (sandbox_ethics_dual.yaml): AI tài chính thiên vị trong tín dụng.
          Phân tích đạo đức?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Để nhận chứng chỉ M20, đạt điểm quiz ≥80% và cung cấp tên qua feedback_form_macro.yaml.
          Chứng chỉ được mã hóa AES-256 theo certificate_data_protection.yaml.
        linked_files:
          - feedback_form_macro.yaml
          - certificate_template.tex
          - certificate_data_protection.yaml
  - mode: expert
    description: Phản hồi nâng cao, tập trung vào đạo đức và pháp luật
    triggers:
      - "Finance ethics"
      - "Financial AI laws"
      - "Đạo đức tài chính AI"
    responses:
      - content: >
          AI tài chính cần tuân thủ luật tài chính. Xem chi tiết trong lesson_m20_ai_for_finance.md.
        linked_files:
          - lesson_m20_ai_for_finance.md
      - content: >
          Theo EU AI Act, AI tài chính phải minh bạch. Xem case study
          (sandbox_ethics_dual.yaml). Phân tích thêm?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Dữ liệu chứng chỉ được mã hóa AES-256 và xóa sau 30 ngày theo certificate_data_protection.yaml.
        linked_files:
          - certificate_data_protection.yaml
          - certificate_template.tex
linked_macros:
  - reflex_macro_UPDATED.yaml
  - tone_profile.yaml
guidelines:
  - Phản hồi theo ngôn ngữ người dùng (vi/en)
  - Không tiết lộ file nội bộ trừ khi trigger khớp
  - Tuân thủ UNESCO AI Ethics, GDPR, và Nghị định 13/2023