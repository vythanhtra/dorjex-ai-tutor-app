# reflex_mapping_m3.yaml
# Ánh xạ phản xạ đa tầng cho M3: Deep Learning trong DorjeX | AI Tutor v2.4

module: M3
description: >
  Ánh xạ phản xạ cho M3, hỗ trợ các cấp độ general, depth, và expert, liên kết với
  lesson_m3_deep_learning.md, quiz_m3.yaml, và certificate_template.tex.
reflex_modes:
  - mode: general
    description: Phản hồi cơ bản, phù hợp với người học mới
    triggers:
      - "Deep learning"
      - "Neural network"
      - "Học sâu"
    responses:
      - content: >
          Deep Learning (DL) sử dụng mạng nơ-ron để học dữ liệu phức tạp. Ví dụ: Nhận diện hình ảnh.
          Bạn muốn học chi tiết không?
        linked_files:
          - lesson_m3_deep_learning.md
      - content: >
          Hoàn thành M3 để nhận chứng chỉ! Làm quiz_m3.yaml và gửi phản hồi qua
          feedback_form_macro.yaml.
        linked_files:
          - quiz_m3.yaml
          - feedback_form_macro.yaml
          - certificate_template.tex
  - mode: depth
    description: Phản hồi chi tiết, bao gồm thuật toán và code
    triggers:
      - "CNN"
      - "Backpropagation"
      - "Mạng nơ-ron"
    responses:
      - content: >
          CNN (Convolutional Neural Network) dùng để xử lý hình ảnh. Xem code trong
          lesson_m3_deep_learning.md.
        linked_files:
          - lesson_m3_deep_learning.md
      - content: >
          Case study m3_ethics (sandbox_ethics_dual.yaml): DL nhận diện khuôn mặt vi phạm quyền riêng tư.
          Phân tích đạo đức?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Để nhận chứng chỉ M3, đạt điểm quiz ≥80% và cung cấp tên qua feedback_form_macro.yaml.
          Chứng chỉ được mã hóa AES-256 theo certificate_data_protection.yaml.
        linked_files:
          - feedback_form_macro.yaml
          - certificate_template.tex
          - certificate_data_protection.yaml
  - mode: expert
    description: Phản hồi nâng cao, tập trung vào đạo đức và xu hướng
    triggers:
      - "DL ethics"
      - "Adversarial DL"
      - "Đạo đức DL"
    responses:
      - content: >
          Adversarial DL tạo mẫu tấn công để kiểm tra mô hình. Xem chi tiết trong lesson_m3_deep_learning.md.
        linked_files:
          - lesson_m3_deep_learning.md
      - content: >
          Theo GDPR, DL phải minh bạch dữ liệu. Xem case study (sandbox_ethics_dual.yaml).
          Phân tích thêm?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Dữ liệu chứng chỉ được mã hóa AES-256 và xóa sau 30 ngày theo certificate_data_protection.yaml.
        linked_files:
          - certificate_data_protection.yaml
          - certificate_template.tex
linked_macros:
  - reflex_macro_UPDATED.yaml
  - tone_profile.yaml
guidelines:
  - Phản hồi theo ngôn ngữ người dùng (vi/en)
  - Không tiết lộ file nội bộ trừ khi trigger khớp
  - Tuân thủ UNESCO AI Ethics, GDPR, và Nghị định 13/2023