# reflex_mapping_m11.yaml
# Ánh xạ phản xạ đa tầng cho M11: Python for AI trong DorjeX | AI Tutor v2.4

module: M11
description: >
  Ánh xạ phản xạ cho M11, hỗ trợ các cấp độ general, depth, và expert, liên kết với
  lesson_m11_python_for_ai.md, quiz_m11_python.yaml, và certificate_template.tex.
reflex_modes:
  - mode: general
    description: Phản hồi cơ bản, phù hợp với người học mới
    triggers:
      - "Python AI"
      - "Học Python"
      - "Python cho AI"
    responses:
      - content: >
          Python là ngôn ngữ phổ biến cho AI, dùng thư viện như TensorFlow, PyTorch.
          Ví dụ: Xây mô hình ML. Bạn muốn học chi tiết không?
        linked_files:
          - lesson_m11_python_for_ai.md
      - content: >
          Hoàn thành M11 để nhận chứng chỉ! Làm quiz_m11_python.yaml và gửi phản hồi qua
          feedback_form_macro.yaml.
        linked_files:
          - quiz_m11_python.yaml
          - feedback_form_macro.yaml
          - certificate_template.tex
  - mode: depth
    description: Phản hồi chi tiết, bao gồm thư viện và code
    triggers:
      - "Numpy"
      - "Pandas"
      - "Code Python AI"
    responses:
      - content: >
          NumPy và Pandas dùng để xử lý dữ liệu trong AI. Xem code ví dụ trong
          lesson_m11_python_for_ai.md.
        linked_files:
          - lesson_m11_python_for_ai.md
      - content: >
          Case study m11_ethics (sandbox_ethics_dual.yaml): Code AI thu thập dữ liệu không minh bạch.
          Phân tích đạo đức?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Để nhận chứng chỉ M11, đạt điểm quiz ≥80% và cung cấp tên qua feedback_form_macro.yaml.
          Chứng chỉ được mã hóa AES-256 theo certificate_data_protection.yaml.
        linked_files:
          - feedback_form_macro.yaml
          - certificate_template.tex
          - certificate_data_protection.yaml
  - mode: expert
    description: Phản hồi nâng cao, tập trung vào đạo đức và bảo mật
    triggers:
      - "Python ethics"
      - "Secure coding"
      - "Đạo đức code Python"
    responses:
      - content: >
          Code Python cho AI cần bảo mật và minh bạch. Xem chi tiết trong lesson_m11_python_for_ai.md.
        linked_files:
          - lesson_m11_python_for_ai.md
      - content: >
          Theo GDPR, code AI phải bảo vệ dữ liệu người dùng. Xem case study
          (sandbox_ethics_dual.yaml). Phân tích thêm?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Dữ liệu chứng chỉ được mã hóa AES-256 và xóa sau 30 ngày theo certificate_data_protection.yaml.
        linked_files:
          - certificate_data_protection.yaml
          - certificate_template.tex
linked_macros:
  - reflex_macro_UPDATED.yaml
  - tone_profile.yaml
guidelines:
  - Phản hồi theo ngôn ngữ người dùng (vi/en)
  - Không tiết lộ file nội bộ trừ khi trigger khớp
  - Tuân thủ UNESCO AI Ethics, GDPR, và Nghị định 13/2023