# reflex_mapping_m13.yaml
# Ánh xạ phản xạ đa tầng cho M13: Multimodal AI trong DorjeX | AI Tutor v2.4

module: M13
description: >
  Ánh xạ phản xạ cho M13, hỗ trợ các cấp độ general, depth, và expert, liên kết với
  lesson_m13_multimodal_ai.md, quiz_m13.yaml, và certificate_template.tex.
reflex_modes:
  - mode: general
    description: Phản hồi cơ bản, phù hợp với người học mới
    triggers:
      - "Multimodal AI"
      - "Text image"
      - "AI đa phương thức"
    responses:
      - content: >
          Multimodal AI xử lý nhiều loại dữ liệu như văn bản, hình ảnh. Ví dụ: GPT-4o, DALL-E.
          Bạn muốn học chi tiết không?
        linked_files:
          - lesson_m13_multimodal_ai.md
      - content: >
          Hoàn thành M13 để nhận chứng chỉ! Làm quiz_m13.yaml và gửi phản hồi qua
          feedback_form_macro.yaml.
        linked_files:
          - quiz_m13.yaml
          - feedback_form_macro.yaml
          - certificate_template.tex
  - mode: depth
    description: Phản hồi chi tiết, bao gồm mô hình và ứng dụng
    triggers:
      - "GPT-4o"
      - "DALL-E"
      - "Mô hình đa phương thức"
    responses:
      - content: >
          GPT-4o xử lý văn bản và hình ảnh đồng thời. Xem ví dụ trong lesson_m13_multimodal_ai.md.
        linked_files:
          - lesson_m13_multimodal_ai.md
      - content: >
          Case study m13_ethics (sandbox_ethics_dual.yaml): AI đa phương thức vi phạm bản quyền hình ảnh.
          Phân tích đạo đức?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Để nhận chứng chỉ M13, đạt điểm quiz ≥80% và cung cấp tên qua feedback_form_macro.yaml.
          Chứng chỉ được mã hóa AES-256 theo certificate_data_protection.yaml.
        linked_files:
          - feedback_form_macro.yaml
          - certificate_template.tex
          - certificate_data_protection.yaml
  - mode: expert
    description: Phản hồi nâng cao, tập trung vào đạo đức và quyền riêng tư
    triggers:
      - "Multimodal ethics"
      - "Multimodal privacy"
      - "Đạo đức đa phương thức"
    responses:
      - content: >
          Multimodal AI cần bảo vệ quyền riêng tư dữ liệu. Xem chi tiết trong lesson_m13_multimodal_ai.md.
        linked_files:
          - lesson_m13_multimodal_ai.md
      - content: >
          Theo GDPR, AI đa phương thức phải xin phép dữ liệu. Xem case study
          (sandbox_ethics_dual.yaml). Phân tích thêm?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Dữ liệu chứng chỉ được mã hóa AES-256 và xóa sau 30 ngày theo certificate_data_protection.yaml.
        linked_files:
          - certificate_data_protection.yaml
          - certificate_template.tex
linked_macros:
  - reflex_macro_UPDATED.yaml
  - tone_profile.yaml
guidelines:
  - Phản hồi theo ngôn ngữ người dùng (vi/en)
  - Không tiết lộ file nội bộ trừ khi trigger khớp
  - Tuân thủ UNESCO AI Ethics, GDPR, và Nghị định 13/2023