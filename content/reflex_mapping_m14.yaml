# reflex_mapping_m14.yaml
# Ánh xạ phản xạ đa tầng cho M14: Quantum AI trong DorjeX | AI Tutor v2.4

module: M14
description: >
  Ánh xạ phản xạ cho M14, hỗ trợ các cấp độ general, depth, và expert, liên kết với
  lesson_m14_quantum_ai.md, quiz_m14.yaml, và certificate_template.tex.
reflex_modes:
  - mode: general
    description: Phản hồi cơ bản, phù hợp với người học mới
    triggers:
      - "Quantum AI"
      - "Quantum computing"
      - "AI lượng tử"
    responses:
      - content: >
          Quantum AI kết hợp điện toán lượng tử và AI để giải bài toán phức tạp.
          Ví dụ: Tối ưu hóa ML. Bạn muốn học chi tiết không?
        linked_files:
          - lesson_m14_quantum_ai.md
      - content: >
          Hoàn thành M14 để nhận chứng chỉ! Làm quiz_m14.yaml và gửi phản hồi qua
          feedback_form_macro.yaml.
        linked_files:
          - quiz_m14.yaml
          - feedback_form_macro.yaml
          - certificate_template.tex
  - mode: depth
    description: Phản hồi chi tiết, bao gồm thuật toán và ứng dụng
    triggers:
      - "Quantum ML"
      - "Quantum algorithms"
      - "Thuật toán lượng tử"
    responses:
      - content: >
          Quantum ML sử dụng thuật toán lượng tử để tăng tốc học máy. Xem ví dụ trong
          lesson_m14_quantum_ai.md.
        linked_files:
          - lesson_m14_quantum_ai.md
      - content: >
          Case study m14_ethics (sandbox_ethics_dual.yaml): Quantum AI gây rủi ro bảo mật.
          Phân tích đạo đức?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Để nhận chứng chỉ M14, đạt điểm quiz ≥80% và cung cấp tên qua feedback_form_macro.yaml.
          Chứng chỉ được mã hóa AES-256 theo certificate_data_protection.yaml.
        linked_files:
          - feedback_form_macro.yaml
          - certificate_template.tex
          - certificate_data_protection.yaml
  - mode: expert
    description: Phản hồi nâng cao, tập trung vào đạo đức và bảo mật
    triggers:
      - "Quantum ethics"
      - "Quantum security"
      - "Đạo đức lượng tử"
    responses:
      - content: >
          Quantum AI cần đảm bảo an ninh dữ liệu. Xem chi tiết trong lesson_m14_quantum_ai.md.
        linked_files:
          - lesson_m14_quantum_ai.md
      - content: >
          Theo EU AI Act, quantum AI phải có kiểm soát rủi ro. Xem case study
          (sandbox_ethics_dual.yaml). Phân tích thêm?
        linked_files:
          - sandbox_ethics_dual.yaml
      - content: >
          Dữ liệu chứng chỉ được mã hóa AES-256 và xóa sau 30 ngày theo certificate_data_protection.yaml.
        linked_files:
          - certificate_data_protection.yaml
          - certificate_template.tex
linked_macros:
  - reflex_macro_UPDATED.yaml
  - tone_profile.yaml
guidelines:
  - Phản hồi theo ngôn ngữ người dùng (vi/en)
  - Không tiết lộ file nội bộ trừ khi trigger khớp
  - Tuân thủ UNESCO AI Ethics, GDPR, và Nghị định 13/2023